<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Al Deafah icon set (Phase 7). 24×24 grid, 1.5 px stroke, square caps, mitre joins, radius 0, currentColor.
       Geometry is derived from the brand's square-Kufic block (assets/brand/pattern/kufic-2x2.svg): that tile is drawn on a
       27-module grid where every stroke and every gap is exactly one module (3.016 units). Mapped onto 24 px, one module is
       1.5 px — the stroke width — so icons are built from orthogonal runs and right-angle steps on a 1.5 px module, and curves
       are replaced by stepped outlines (marker, crescent, hat, dome, heart, shield, handset).
       "whatsapp" is a generic chat glyph (speech square + handset), deliberately not the WhatsApp trademark. Diagonals are kept only where the
       sign cannot exist without them (arrows, check, close, chevron, star, plane).
       Direction: arrow-start / arrow-end are logical; site.css mirrors them under dir="rtl".
       Usage: <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#rooms"/></svg> -->
